# Publica la web estática en cdmon (lvirens.com) — 02/10/2026.
#
# Push a `produccion` (o a mano desde Actions) → compila la web, sube UN zip
# por FTP a `web/` junto con `descomprimir.php` (clave nueva en cada
# ejecución) y abre ese script por HTTPS: descomprime encima, sobrescribe y se
# borra junto con el zip. Es el mismo método que se probó a mano el 02/10.
#
# Por qué así: cdmon no admite FTPS («500 AUTH not understood») y con FTP
# plano la subida archivo a archivo (FTP-Deploy-Action) moría al listar
# carpetas (ECONNRESET en el canal de datos). Un zip = dos transferencias.
# `--disable-epsv` fuerza PASV clásico, que es lo que suelen aceptar los
# servidores FTP detrás de NAT.
#
# Secretos (Settings → Secrets and variables → Actions):
#   CDMON_FTP_SERVER, CDMON_FTP_USER, CDMON_FTP_PASSWORD
name: Publicar en cdmon

on:
  push:
    branches: [produccion]
  workflow_dispatch:

concurrency:
  group: cdmon
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:static

      - name: Subir zip y script a cdmon
        env:
          FTP_SERVER: ${{ secrets.CDMON_FTP_SERVER }}
          FTP_USER: ${{ secrets.CDMON_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CDMON_FTP_PASSWORD }}
        run: |
          clave=$(openssl rand -hex 16)
          echo "::add-mask::$clave"
          echo "CLAVE=$clave" >> "$GITHUB_ENV"
          sed "s/__CLAVE__/$clave/g" scripts/descomprimir.php > descomprimir.php
          for f in virens-web-estatica.zip descomprimir.php; do
            curl --fail --silent --show-error --disable-epsv --retry 3 \
              --user "$FTP_USER:$FTP_PASSWORD" -T "$f" "ftp://$FTP_SERVER/web/"
            echo "Subido: $f"
          done

      - name: Descomprimir en el servidor
        run: |
          respuesta=$(curl --fail --silent --show-error --max-time 300 \
            "https://lvirens.com/descomprimir.php?clave=$CLAVE")
          echo "$respuesta"
          grep -q '^LISTO' <<<"$respuesta"
